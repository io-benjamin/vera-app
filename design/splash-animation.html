<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera — Splash Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    h1 {
      color: white;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    
    button {
      background: #FF6B6B;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    
    button.secondary {
      background: transparent;
      border: 2px solid #FF6B6B;
      color: #FF6B6B;
    }
    
    .phone {
      width: 300px;
      height: 620px;
      background: #FFF8F0;
      border-radius: 44px;
      position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    
    .phone::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 20px;
      z-index: 10;
    }
    
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .animation-stage {
      width: 240px;
      height: 240px;
      position: relative;
    }
    
    .connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .connection {
      stroke: #FF6B6B;
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      opacity: 0;
      fill: none;
    }
    
    /* Person icons */
    .person {
      position: absolute;
      width: 28px;
      height: 28px;
      opacity: 0;
      transform: scale(0.8);
    }
    
    .person svg {
      width: 100%;
      height: 100%;
    }
    
    /* Center person - larger */
    .person.center {
      width: 34px;
      height: 34px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
    }
    
    /* 6 outer people in hexagon pattern around center */
    .person.p1 { top: 30px; left: 106px; }   /* top */
    .person.p2 { top: 60px; left: 175px; }   /* top-right */
    .person.p3 { top: 150px; left: 175px; }  /* bottom-right */
    .person.p4 { top: 180px; left: 106px; }  /* bottom */
    .person.p5 { top: 150px; left: 37px; }   /* bottom-left */
    .person.p6 { top: 60px; left: 37px; }    /* top-left */
    
    /* Secondary connections - friends of friends (smaller) */
    .person.secondary {
      width: 20px;
      height: 20px;
    }
    
    /* Secondary people - 2 per outer person */
    .person.s1a { top: 5px; left: 70px; }
    .person.s1b { top: 5px; left: 150px; }
    
    .person.s2a { top: 25px; left: 205px; }
    .person.s2b { top: 85px; left: 215px; }
    
    .person.s3a { top: 145px; left: 215px; }
    .person.s3b { top: 185px; left: 205px; }
    
    .person.s4a { top: 210px; left: 150px; }
    .person.s4b { top: 210px; left: 70px; }
    
    .person.s5a { top: 185px; left: 10px; }
    .person.s5b { top: 145px; left: 5px; }
    
    .person.s6a { top: 85px; left: 5px; }
    .person.s6b { top: 25px; left: 10px; }
    
    /* Logo */
    .logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    
    .logo {
      font-size: 52px;
      font-weight: 700;
      color: #FF6B6B;
      letter-spacing: -2px;
    }
    
    .tagline {
      font-size: 14px;
      color: #8B8680;
      margin-top: 8px;
      opacity: 0;
    }
    
    /* Keyframes */
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes fadeInScaleCenter {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    @keyframes drawLine {
      from { stroke-dashoffset: 80; opacity: 0; }
      to { stroke-dashoffset: 0; opacity: 0.5; }
    }
    
    @keyframes fadeOut {
      to { opacity: 0; }
    }
    
    @keyframes logoReveal {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    @keyframes taglineFade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Phase 1: Center + primary network */
    .phase1 .person.center {
      animation: fadeInScaleCenter 0.3s ease-out forwards;
    }
    
    .phase1 .person.p1 { animation: fadeInScale 0.25s ease-out 0.3s forwards; }
    .phase1 .person.p2 { animation: fadeInScale 0.25s ease-out 0.4s forwards; }
    .phase1 .person.p3 { animation: fadeInScale 0.25s ease-out 0.5s forwards; }
    .phase1 .person.p4 { animation: fadeInScale 0.25s ease-out 0.6s forwards; }
    .phase1 .person.p5 { animation: fadeInScale 0.25s ease-out 0.7s forwards; }
    .phase1 .person.p6 { animation: fadeInScale 0.25s ease-out 0.8s forwards; }
    
    .phase1 .connection.c1 { animation: drawLine 0.3s ease-out 0.35s forwards; }
    .phase1 .connection.c2 { animation: drawLine 0.3s ease-out 0.45s forwards; }
    .phase1 .connection.c3 { animation: drawLine 0.3s ease-out 0.55s forwards; }
    .phase1 .connection.c4 { animation: drawLine 0.3s ease-out 0.65s forwards; }
    .phase1 .connection.c5 { animation: drawLine 0.3s ease-out 0.75s forwards; }
    .phase1 .connection.c6 { animation: drawLine 0.3s ease-out 0.85s forwards; }
    
    /* Phase 2: Secondary networks grow from each person */
    .phase2 .person.s1a { animation: fadeInScale 0.2s ease-out 0.0s forwards; }
    .phase2 .person.s1b { animation: fadeInScale 0.2s ease-out 0.05s forwards; }
    .phase2 .person.s2a { animation: fadeInScale 0.2s ease-out 0.1s forwards; }
    .phase2 .person.s2b { animation: fadeInScale 0.2s ease-out 0.15s forwards; }
    .phase2 .person.s3a { animation: fadeInScale 0.2s ease-out 0.2s forwards; }
    .phase2 .person.s3b { animation: fadeInScale 0.2s ease-out 0.25s forwards; }
    .phase2 .person.s4a { animation: fadeInScale 0.2s ease-out 0.3s forwards; }
    .phase2 .person.s4b { animation: fadeInScale 0.2s ease-out 0.35s forwards; }
    .phase2 .person.s5a { animation: fadeInScale 0.2s ease-out 0.4s forwards; }
    .phase2 .person.s5b { animation: fadeInScale 0.2s ease-out 0.45s forwards; }
    .phase2 .person.s6a { animation: fadeInScale 0.2s ease-out 0.5s forwards; }
    .phase2 .person.s6b { animation: fadeInScale 0.2s ease-out 0.55s forwards; }
    
    .phase2 .connection.s1a { animation: drawLine 0.2s ease-out 0.0s forwards; }
    .phase2 .connection.s1b { animation: drawLine 0.2s ease-out 0.05s forwards; }
    .phase2 .connection.s2a { animation: drawLine 0.2s ease-out 0.1s forwards; }
    .phase2 .connection.s2b { animation: drawLine 0.2s ease-out 0.15s forwards; }
    .phase2 .connection.s3a { animation: drawLine 0.2s ease-out 0.2s forwards; }
    .phase2 .connection.s3b { animation: drawLine 0.2s ease-out 0.25s forwards; }
    .phase2 .connection.s4a { animation: drawLine 0.2s ease-out 0.3s forwards; }
    .phase2 .connection.s4b { animation: drawLine 0.2s ease-out 0.35s forwards; }
    .phase2 .connection.s5a { animation: drawLine 0.2s ease-out 0.4s forwards; }
    .phase2 .connection.s5b { animation: drawLine 0.2s ease-out 0.45s forwards; }
    .phase2 .connection.s6a { animation: drawLine 0.2s ease-out 0.5s forwards; }
    .phase2 .connection.s6b { animation: drawLine 0.2s ease-out 0.55s forwards; }
    
    /* Phase 3: Converge - everything fades */
    .phase3 .person,
    .phase3 .connection {
      animation: fadeOut 0.4s ease-in forwards !important;
    }
    
    /* Phase 4: Logo */
    .phase4 .person,
    .phase4 .connection {
      opacity: 0 !important;
      visibility: hidden;
    }
    
    .phase4 .logo-container {
      animation: logoReveal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    .phase4 .tagline {
      animation: taglineFade 0.3s ease-out 0.25s forwards;
    }
    
    .status {
      margin-top: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>

          </svg>
        </div>
        <div class="person p5">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/><path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p6">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/><path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>

        <!-- Secondary network (friends of friends - smaller, lighter) -->
        <div class="person secondary s1a">

  </div>
  
  <div class="status" id="status">Click play to start</div>
  
  <script>
    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    let timeouts = [];
    
    function clearTimeouts() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts = [];
    }
    
    function playAnimation() {
      resetAnimation();
      
      timeouts.push(setTimeout(() => {
        // Phase 1: You + primary network
        status.textContent = 'Phase 1: Your network forms...';
        stage.classList.add('phase1');
        
        // Phase 2: Secondary networks grow
        timeouts.push(setTimeout(() => {
          status.textContent = 'Phase 2: Everyone makes connections...';
          stage.classList.add('phase2');
          
          // Phase 3: Converge
          timeouts.push(setTimeout(() => {
            status.textContent = 'Phase 3: Connections converge...';
            stage.classList.remove('phase1', 'phase2');
            stage.classList.add('phase3');
            
            // Phase 4: Logo
            timeouts.push(setTimeout(() => {
              status.textContent = 'Phase 4: Vera emerges';
              stage.classList.remove('phase3');
              stage.classList.add('phase4');
              
              timeouts.push(setTimeout(() => {
                status.textContent = '✓ Animation complete';
              }, 600));
              
            }, 450));
            
          }, 1000));
          
        }, 1200));
      }, 100));
    }
    
    function resetAnimation() {
      clearTimeouts();
      stage.classList.remove('phase1', 'phase2', 'phase3', 'phase4');
      
      document.querySelectorAll('.person').forEach(p => {
        p.style.opacity = '0';
        p.style.visibility = 'visible';
      });
      
      document.querySelector('.person.center').style.transform = 'translate(-50%, -50%) scale(0.8)';
      
      document.querySelectorAll('.connection').forEach(c => {
        c.style.opacity = '0';
        c.style.visibility = 'visible';
      });
      
      document.querySelector('.logo-container').style.opacity = '0';
      document.querySelector('.tagline').style.opacity = '0';
      
      status.textContent = 'Click play to start';
    }
    
    resetAnimation();
  </script>
</body>
</html>
