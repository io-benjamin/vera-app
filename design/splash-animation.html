<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera — Splash Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    h1 {
      color: white;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    
    button {
      background: #FF6B6B;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:active {
      transform: scale(0.97);
    }
    
    button.secondary {
      background: transparent;
      border: 2px solid #FF6B6B;
      color: #FF6B6B;
    }
    
    .phone {
      width: 300px;
      height: 620px;
      background: #FFF8F0;
      border-radius: 44px;
      position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    
    .phone::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 20px;
      z-index: 10;
    }
    
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .animation-stage {
      width: 220px;
      height: 220px;
      position: relative;
    }
    
    /* Connection lines */
    .connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .connection {
      stroke: #FF6B6B;
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      opacity: 0;
      fill: none;
    }
    
    /* Person icons - positioned to align with lines */
    .person {
      position: absolute;
      width: 32px;
      height: 32px;
      opacity: 0;
      transform: scale(0.8);
    }
    
    .person svg {
      width: 100%;
      height: 100%;
    }
    
    /* Center person */
    .person.center {
      width: 36px;
      height: 36px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
    }
    
    /* Outer people - positioned so their centers align with line endpoints */
    .person.p1 { top: 18px; left: 30px; }      /* top-left */
    .person.p2 { top: 8px; left: 94px; }       /* top */
    .person.p3 { top: 28px; left: 158px; }     /* top-right */
    .person.p4 { top: 94px; left: 175px; }     /* right */
    .person.p5 { top: 160px; left: 148px; }    /* bottom-right */
    .person.p6 { top: 160px; left: 40px; }     /* bottom-left */
    .person.p7 { top: 94px; left: 5px; }       /* left */
    .person.p8 { top: 28px; left: 5px; }       /* top-left-2 */
    
    /* Logo */
    .logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    
    .logo {
      font-size: 52px;
      font-weight: 700;
      color: #FF6B6B;
      letter-spacing: -2px;
    }
    
    .tagline {
      font-size: 14px;
      color: #8B8680;
      margin-top: 8px;
      opacity: 0;
    }
    
    /* Animation keyframes */
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes fadeInScaleCenter {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    @keyframes drawLine {
      from { stroke-dashoffset: 80; opacity: 0; }
      to { stroke-dashoffset: 0; opacity: 0.5; }
    }
    
    @keyframes fadeOut {
      to { opacity: 0; }
    }
    
    @keyframes convergeAndFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.3) translate(0, 0); }
    }
    
    @keyframes convergeCenterAndFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
    }
    
    @keyframes logoReveal {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    @keyframes taglineFade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Phase 1: appear */
    .animating .person.center {
      animation: fadeInScaleCenter 0.3s ease-out forwards;
    }
    
    .animating .person.p1 { animation: fadeInScale 0.25s ease-out 0.4s forwards; }
    .animating .person.p2 { animation: fadeInScale 0.25s ease-out 0.5s forwards; }
    .animating .person.p3 { animation: fadeInScale 0.25s ease-out 0.6s forwards; }
    .animating .person.p4 { animation: fadeInScale 0.25s ease-out 0.7s forwards; }
    .animating .person.p5 { animation: fadeInScale 0.25s ease-out 0.8s forwards; }
    .animating .person.p6 { animation: fadeInScale 0.25s ease-out 0.9s forwards; }
    .animating .person.p7 { animation: fadeInScale 0.25s ease-out 1.0s forwards; }
    .animating .person.p8 { animation: fadeInScale 0.25s ease-out 1.1s forwards; }
    
    .animating .connection.c1 { animation: drawLine 0.3s ease-out 0.45s forwards; }
    .animating .connection.c2 { animation: drawLine 0.3s ease-out 0.55s forwards; }
    .animating .connection.c3 { animation: drawLine 0.3s ease-out 0.65s forwards; }
    .animating .connection.c4 { animation: drawLine 0.3s ease-out 0.75s forwards; }
    .animating .connection.c5 { animation: drawLine 0.3s ease-out 0.85s forwards; }
    .animating .connection.c6 { animation: drawLine 0.3s ease-out 0.95s forwards; }
    .animating .connection.c7 { animation: drawLine 0.3s ease-out 1.05s forwards; }
    .animating .connection.c8 { animation: drawLine 0.3s ease-out 1.15s forwards; }
    
    /* Phase 2: Converge - everything fades out */
    .converging .person {
      animation: convergeAndFade 0.4s ease-in forwards !important;
    }
    
    .converging .person.center {
      animation: convergeCenterAndFade 0.4s ease-in forwards !important;
    }
    
    .converging .connection {
      animation: fadeOut 0.3s ease-out forwards !important;
    }
    
    /* Phase 3: Logo - people should be hidden */
    .logo-reveal .person {
      opacity: 0 !important;
      visibility: hidden;
    }
    
    .logo-reveal .connection {
      opacity: 0 !important;
      visibility: hidden;
    }
    
    .logo-reveal .logo-container {
      animation: logoReveal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    .logo-reveal .tagline {
      animation: taglineFade 0.3s ease-out 0.25s forwards;
    }
    
    .status {
      margin-top: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Vera Splash Animation</h1>
  
  <div class="controls">
    <button onclick="playAnimation()">▶ Play Animation</button>
    <button class="secondary" onclick="resetAnimation()">↺ Reset</button>
  </div>
  
  <div class="phone">
    <div class="splash-container">
      <div class="animation-stage" id="stage">
        
        <!-- Connection lines - endpoints match person positions -->
        <svg class="connections" viewBox="0 0 220 220">
          <!-- Lines from edge of center (110,110 with ~20px radius) to edge of each person -->
          <line class="connection c1" x1="95" y1="95" x2="50" y2="40"/>
          <line class="connection c2" x1="110" y1="90" x2="110" y2="30"/>
          <line class="connection c3" x1="125" y1="95" x2="175" y2="50"/>
          <line class="connection c4" x1="130" y1="110" x2="190" y2="110"/>
          <line class="connection c5" x1="125" y1="125" x2="170" y2="175"/>
          <line class="connection c6" x1="95" y1="125" x2="55" y2="175"/>
          <line class="connection c7" x1="90" y1="110" x2="30" y2="110"/>
          <line class="connection c8" x1="95" y1="95" x2="25" y2="50"/>
        </svg>
        
        <!-- Center person (you) -->
        <div class="person center">
          <svg viewBox="0 0 40 40" fill="none" stroke="#2C2C2C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        
        <!-- Surrounding people - aligned with line endpoints -->
        <div class="person p1">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p2">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p3">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p4">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p5">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p6">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p7">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p8">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        
        <!-- Logo -->
        <div class="logo-container" id="logoContainer">
          <div class="logo">vera</div>
          <div class="tagline" id="tagline">Real connection, daily</div>
        </div>
        
      </div>
    </div>
  </div>
  
  <div class="status" id="status">Click play to start</div>
  
  <script>
    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    let timeouts = [];
    
    function clearTimeouts() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts = [];
    }
    
    function playAnimation() {
      resetAnimation();
      
      timeouts.push(setTimeout(() => {
        // Phase 1: People appear
        status.textContent = 'Phase 1: You appear...';
        stage.classList.add('animating');
        
        // Phase 2: Converge
        timeouts.push(setTimeout(() => {
          status.textContent = 'Phase 2: Connections converge...';
          stage.classList.remove('animating');
          stage.classList.add('converging');
          
          // Phase 3: Logo reveal - after converge completes
          timeouts.push(setTimeout(() => {
            status.textContent = 'Phase 3: Vera emerges';
            stage.classList.remove('converging');
            stage.classList.add('logo-reveal');
            
            timeouts.push(setTimeout(() => {
              status.textContent = '✓ Animation complete';
            }, 600));
            
          }, 450));
          
        }, 1800));
      }, 100));
    }
    
    function resetAnimation() {
      clearTimeouts();
      stage.classList.remove('animating', 'converging', 'logo-reveal');
      
      // Reset all elements
      document.querySelectorAll('.person').forEach(p => {
        p.style.opacity = '0';
        p.style.visibility = 'visible';
        p.style.transform = '';
      });
      
      document.querySelector('.person.center').style.transform = 'translate(-50%, -50%) scale(0.8)';
      
      document.querySelectorAll('.connection').forEach(c => {
        c.style.opacity = '0';
        c.style.visibility = 'visible';
      });
      
      document.getElementById('logoContainer').style.opacity = '0';
      document.getElementById('logoContainer').style.transform = 'translate(-50%, -50%) scale(0.6)';
      document.getElementById('tagline').style.opacity = '0';
      
      status.textContent = 'Click play to start';
    }
    
    resetAnimation();
  </script>
</body>
</html>
