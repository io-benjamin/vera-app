<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera — Splash Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    h1 {
      color: white;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    
    button {
      background: #FF6B6B;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:active {
      transform: scale(0.97);
    }
    
    button.secondary {
      background: transparent;
      border: 2px solid #FF6B6B;
      color: #FF6B6B;
    }
    
    .phone {
      width: 300px;
      height: 620px;
      background: #FFF8F0;
      border-radius: 44px;
      position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    
    .phone::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 20px;
      z-index: 10;
    }
    
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .animation-stage {
      width: 220px;
      height: 220px;
      position: relative;
    }
    
    /* Connection lines - adjusted to stop at edge of icons */
    .connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .connection {
      stroke: #FF6B6B;
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      opacity: 0;
      fill: none;
    }
    
    /* Person icons */
    .person {
      position: absolute;
      width: 36px;
      height: 36px;
      opacity: 0;
      transform: scale(0.8);
      transition: none;
    }
    
    .person svg {
      width: 100%;
      height: 100%;
    }
    
    .person.center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
    }
    
    .person.p1 { top: 12%; left: 22%; }
    .person.p2 { top: 5%; left: 52%; }
    .person.p3 { top: 20%; left: 78%; }
    .person.p4 { top: 52%; left: 85%; }
    .person.p5 { top: 78%; left: 68%; }
    .person.p6 { top: 78%; left: 28%; }
    .person.p7 { top: 52%; left: 2%; }
    .person.p8 { top: 20%; left: 8%; }
    
    /* Logo */
    .logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      text-align: center;
      opacity: 0;
      pointer-events: none;
    }
    
    .logo {
      font-size: 52px;
      font-weight: 700;
      color: #FF6B6B;
      letter-spacing: -2px;
    }
    
    .tagline {
      font-size: 14px;
      color: #8B8680;
      margin-top: 8px;
      opacity: 0;
    }
    
    /* Animation keyframes */
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes fadeInScaleCenter {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    
    @keyframes drawLine {
      from {
        stroke-dashoffset: 60;
        opacity: 0;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 0.5;
      }
    }
    
    @keyframes convergeP1 {
      to { top: 42%; left: 38%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP2 {
      to { top: 38%; left: 50%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP3 {
      to { top: 42%; left: 62%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP4 {
      to { top: 50%; left: 65%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP5 {
      to { top: 58%; left: 58%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP6 {
      to { top: 58%; left: 42%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP7 {
      to { top: 50%; left: 35%; opacity: 0; transform: scale(0.3); }
    }
    @keyframes convergeP8 {
      to { top: 42%; left: 38%; opacity: 0; transform: scale(0.3); }
    }
    
    @keyframes convergeCenterPerson {
      to {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
    }
    
    @keyframes fadeOutLines {
      to {
        opacity: 0;
      }
    }
    
    @keyframes logoReveal {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    
    @keyframes taglineFade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Animation states - Phase 1: appear */
    .animating .person.center {
      animation: fadeInScaleCenter 0.3s ease-out forwards;
    }
    
    .animating .person.p1 { animation: fadeInScale 0.25s ease-out 0.4s forwards; }
    .animating .person.p2 { animation: fadeInScale 0.25s ease-out 0.55s forwards; }
    .animating .person.p3 { animation: fadeInScale 0.25s ease-out 0.7s forwards; }
    .animating .person.p4 { animation: fadeInScale 0.25s ease-out 0.85s forwards; }
    .animating .person.p5 { animation: fadeInScale 0.25s ease-out 1.0s forwards; }
    .animating .person.p6 { animation: fadeInScale 0.25s ease-out 1.15s forwards; }
    .animating .person.p7 { animation: fadeInScale 0.25s ease-out 1.3s forwards; }
    .animating .person.p8 { animation: fadeInScale 0.25s ease-out 1.45s forwards; }
    
    .animating .connection.c1 { animation: drawLine 0.3s ease-out 0.5s forwards; }
    .animating .connection.c2 { animation: drawLine 0.3s ease-out 0.65s forwards; }
    .animating .connection.c3 { animation: drawLine 0.3s ease-out 0.8s forwards; }
    .animating .connection.c4 { animation: drawLine 0.3s ease-out 0.95s forwards; }
    .animating .connection.c5 { animation: drawLine 0.3s ease-out 1.1s forwards; }
    .animating .connection.c6 { animation: drawLine 0.3s ease-out 1.25s forwards; }
    .animating .connection.c7 { animation: drawLine 0.3s ease-out 1.4s forwards; }
    .animating .connection.c8 { animation: drawLine 0.3s ease-out 1.55s forwards; }
    
    /* Phase 2: Converge */
    .converging .person.p1 { animation: convergeP1 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p2 { animation: convergeP2 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p3 { animation: convergeP3 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p4 { animation: convergeP4 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p5 { animation: convergeP5 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p6 { animation: convergeP6 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p7 { animation: convergeP7 0.5s ease-in-out forwards; opacity: 1; }
    .converging .person.p8 { animation: convergeP8 0.5s ease-in-out forwards; opacity: 1; }
    
    .converging .person.center {
      animation: convergeCenterPerson 0.5s ease-in-out forwards;
      opacity: 1;
    }
    
    .converging .connection {
      animation: fadeOutLines 0.3s ease-out forwards;
    }
    
    /* Phase 3: Logo */
    .logo-reveal .logo-container {
      animation: logoReveal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    .logo-reveal .tagline {
      animation: taglineFade 0.3s ease-out 0.25s forwards;
    }
    
    .status {
      margin-top: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Vera Splash Animation</h1>
  
  <div class="controls">
    <button onclick="playAnimation()">▶ Play Animation</button>
    <button class="secondary" onclick="resetAnimation()">↺ Reset</button>
  </div>
  
  <div class="phone">
    <div class="splash-container">
      <div class="animation-stage" id="stage">
        
        <!-- Connection lines SVG - lines stop at edge of center icon (radius ~25px from center) -->
        <svg class="connections" viewBox="0 0 220 220">
          <!-- Lines from outer people to edge of center person (not all the way in) -->
          <line class="connection c1" x1="88" y1="92" x2="55" y2="38"/>
          <line class="connection c2" x1="110" y1="88" x2="125" y2="28"/>
          <line class="connection c3" x1="132" y1="92" x2="182" y2="55"/>
          <line class="connection c4" x1="135" y1="110" x2="195" y2="125"/>
          <line class="connection c5" x1="128" y1="132" x2="165" y2="185"/>
          <line class="connection c6" x1="92" y1="132" x2="62" y2="185"/>
          <line class="connection c7" x1="85" y1="110" x2="22" y2="125"/>
          <line class="connection c8" x1="88" y1="92" x2="35" y2="55"/>
        </svg>
        
        <!-- Center person (you) -->
        <div class="person center">
          <svg viewBox="0 0 40 40" fill="none" stroke="#2C2C2C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        
        <!-- Surrounding people -->
        <div class="person p1">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p2">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p3">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p4">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p5">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p6">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p7">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        <div class="person p8">
          <svg viewBox="0 0 40 40" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="11" r="7"/>
            <path d="M7 35 C7 25, 13 19, 20 19 C27 19, 33 25, 33 35"/>
          </svg>
        </div>
        
        <!-- Logo (hidden initially) -->
        <div class="logo-container" id="logoContainer">
          <div class="logo">vera</div>
          <div class="tagline" id="tagline">Real connection, daily</div>
        </div>
        
      </div>
    </div>
  </div>
  
  <div class="status" id="status">Click play to start</div>
  
  <script>
    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    const logoContainer = document.getElementById('logoContainer');
    const tagline = document.getElementById('tagline');
    let timeouts = [];
    
    function clearTimeouts() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts = [];
    }
    
    function playAnimation() {
      resetAnimation();
      
      // Small delay before starting
      timeouts.push(setTimeout(() => {
        // Phase 1: People appear with connections
        status.textContent = 'Phase 1: You appear...';
        stage.classList.add('animating');
        
        // Phase 2: Converge (after people appear)
        timeouts.push(setTimeout(() => {
          status.textContent = 'Phase 2: Connections converge...';
          stage.classList.remove('animating');
          
          // Set opacity to 1 for all people before converge
          document.querySelectorAll('.person').forEach(p => {
            p.style.opacity = '1';
          });
          document.querySelectorAll('.connection').forEach(c => {
            c.style.opacity = '0.5';
          });
          
          stage.classList.add('converging');
          
          // Phase 3: Logo reveal
          timeouts.push(setTimeout(() => {
            status.textContent = 'Phase 3: Vera emerges';
            stage.classList.remove('converging');
            stage.classList.add('logo-reveal');
            
            timeouts.push(setTimeout(() => {
              status.textContent = '✓ Animation complete';
            }, 600));
            
          }, 550));
          
        }, 2000));
      }, 100));
    }
    
    function resetAnimation() {
      clearTimeouts();
      stage.classList.remove('animating', 'converging', 'logo-reveal');
      
      // Reset all people
      document.querySelectorAll('.person').forEach(p => {
        p.style.opacity = '0';
        p.style.transform = '';
        p.style.top = '';
        p.style.left = '';
      });
      
      // Reset center person specifically
      const center = document.querySelector('.person.center');
      center.style.transform = 'translate(-50%, -50%) scale(0.8)';
      
      // Reset connections
      document.querySelectorAll('.connection').forEach(c => {
        c.style.opacity = '0';
        c.style.strokeDashoffset = '60';
      });
      
      // Reset logo
      logoContainer.style.opacity = '0';
      logoContainer.style.transform = 'translate(-50%, -50%) scale(0.6)';
      tagline.style.opacity = '0';
      
      status.textContent = 'Click play to start';
    }
    
    // Initialize
    resetAnimation();
  </script>
</body>
</html>
